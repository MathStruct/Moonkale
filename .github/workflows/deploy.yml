name: Deploy vault to GitHub Pages

# Publishes the Obsidian vault in markdown/ with Quartz (vendored in site/)
# to https://mathstruct.github.io/Moonkale/

on:
  push:
    branches: [master]
    paths:
      - "markdown/**"
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git history is used for created/modified dates
      # Pages must be enabled once by hand (Settings → Pages → Source: GitHub
      # Actions); the workflow token is not allowed to create the site itself.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build site with Quartz
        working-directory: site
        run: npx quartz build -d ../markdown
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
