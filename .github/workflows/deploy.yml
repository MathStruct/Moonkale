name: Deploy vault to GitHub Pages

# Publishes the Obsidian vault in markdown/ with Quartz (vendored in site/) to
# the gh-pages branch, which GitHub Pages serves (Settings → Pages → Deploy
# from a branch: gh-pages, /). The address is https://mathstruct.org/Moonkale/:
# the organisation's site carries the mathstruct.org domain and project sites
# inherit it, so gh-pages must not contain a CNAME file of its own.

on:
  push:
    branches: [master]
    paths:
      - "markdown/**"
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write # push to gh-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git history is used for created/modified dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build site with Quartz
        working-directory: site
        run: npx quartz build -d ../markdown
      # One commit, force-pushed: the branch holds the current site only, so it
      # doesn't grow with every deploy. .nojekyll: serve the files as they are.
      - name: Publish to gh-pages
        working-directory: site/public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy vault from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
