name: Deploy vault to GitHub Pages

# Publishes the Obsidian vault in markdown/, built by site/build.sh with MathStruct's shared
# Quartz (https://github.com/MathStruct/quartz), to the gh-pages branch, which GitHub Pages
# serves (Settings → Pages → Deploy from a branch: gh-pages, /). The address is https://mathstruct.org/Moonkale/:
# the organisation's site carries the mathstruct.org domain and project sites
# inherit it, so gh-pages must not contain a CNAME file of its own.
#
# A pull request that touches the vault or the site is built too, without publishing: the
# rendered site is attached to the run as the "site" artifact.

on:
  push:
    branches: [master]
    paths:
      - "markdown/**"
      - "site/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "markdown/**"
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write # push to gh-pages

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git history is used for created/modified dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site with Quartz
        run: site/build.sh
      - name: Attach the rendered site to a pull request's run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/public
          retention-days: 14
      # One commit, force-pushed: the branch holds the current site only, so it
      # doesn't grow with every deploy. .nojekyll: serve the files as they are.
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: site/public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy vault from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
