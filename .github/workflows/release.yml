name: Release packages

# Builds every package (Milestone 13) and attaches them to a GitHub Release.
#   - a tag `v*` → release with all artefacts
#   - "Run workflow" by hand → the same artefacts as workflow artefacts, no release
# Linux: tarball + .deb + Arch package + AppImage. Windows: .msi + NSIS .exe.
# macOS: .dmg (x86_64 and arm64). Nix: `nix build` (verifies the flake).
# Windows and macOS bundles are UNSIGNED (see markdown/packaging/Install.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DX_VERSION: 0.7.10
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (tarball, deb, AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: System libraries (WebKitGTK 4.1 et al.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config binutils
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: packaging/build-release.sh --no-arch
      - name: AppImage (dx bundle)
        run: cd packages/desktop && dx bundle --platform desktop --release --features desktop --package-types appimage && cp ../../target/dx/moonkale/bundle/linux/appimage/*.AppImage ../../dist/ || echo "AppImage bundling failed (not fatal)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  arch:
    name: Arch Linux (pacman package)
    runs-on: ubuntu-24.04
    needs: linux
    container:
      image: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: makepkg (as an unprivileged user — makepkg refuses root)
        run: |
          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder .
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cp dist/moonkale-$VERSION-linux-x86_64.tar.gz packaging/arch-bin/
          sudo -u builder env MOONKALE_VERSION=$VERSION bash -c 'cd packaging/arch-bin && makepkg -f --skipchecksums --nodeps'
          mv packaging/arch-bin/moonkale-bin-*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  windows:
    name: Windows (msi, nsis) — unsigned
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Bundle
        run: cd packages/desktop && dx bundle --platform desktop --release --features desktop --package-types msi nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/dx/moonkale/bundle/**/*.msi
            target/dx/moonkale/bundle/**/*.exe

  macos:
    name: macOS (dmg) — unsigned
    strategy:
      matrix:
        include:
          - runner: macos-14        # arm64 (Apple silicon)
            arch: arm64
          - runner: macos-13        # x86_64 (Intel)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Bundle
        run: cd packages/desktop && dx bundle --platform desktop --release --features desktop --package-types dmg
      - name: Name by architecture
        run: for f in target/dx/moonkale/bundle/**/*.dmg target/dx/moonkale/bundle/*/*/*.dmg; do [ -f "$f" ] && mv "$f" "${f%.dmg}-${{ matrix.arch }}.dmg" || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: target/dx/moonkale/bundle/**/*.dmg

  nix:
    name: Nix (flake build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - run: nix build .#default --print-build-logs

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, arch, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      - name: Checksums
        run: cd artefacts && sha256sum * > sha256sums.txt && cat sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artefacts/*
          generate_release_notes: true
          body: |
            Packages for Linux (tarball, .deb, Arch), Windows (.msi / .exe, unsigned) and macOS (.dmg, unsigned).
            Install instructions: https://mathstruct.github.io/Moonkale/packaging/Install
