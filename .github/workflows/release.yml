name: Release packages

# Builds every package (Milestone 13) and attaches them to a GitHub Release.
#   - a tag `v*` → release with all artefacts
#   - "Run workflow" by hand → the same artefacts as workflow artefacts, no release
# Linux: tarball + .deb + Arch package + AppImage. Windows: .msi + NSIS .exe.
# macOS: .dmg (x86_64 and arm64). Nix: `nix build` (verifies the flake).
# Windows and macOS bundles are UNSIGNED (see markdown/packaging/Install.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DX_VERSION: 0.7.10
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (tarball, deb, AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: System libraries (WebKitGTK 4.1 et al.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config binutils
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: packaging/build-release.sh --no-arch
      - name: AppImage (dx bundle)
        run: cd packages/desktop && dx bundle --platform desktop --release --features desktop --package-types appimage && cp ../../target/dx/moonkale/bundle/linux/appimage/*.AppImage ../../dist/ || echo "AppImage bundling failed (not fatal)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  arch:
    name: Arch Linux (pacman package)
    runs-on: ubuntu-24.04
    needs: linux
    container:
      image: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: makepkg (as an unprivileged user — makepkg refuses root)
        run: |
          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder .
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cp dist/moonkale-$VERSION-linux-x86_64.tar.gz packaging/arch-bin/
          sudo -u builder env MOONKALE_VERSION=$VERSION bash -c 'cd packaging/arch-bin && makepkg -f --skipchecksums --nodeps'
          mv packaging/arch-bin/moonkale-bin-*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  windows:
    name: Windows (msi, nsis) — unsigned
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Bundle
        run: cd packages/desktop && dx bundle --platform desktop --release --features desktop --package-types msi nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/dx/moonkale/bundle/**/*.msi
            target/dx/moonkale/bundle/**/*.exe

  macos:
    name: macOS (dmg) — unsigned
    strategy:
      matrix:
        include:
          - runner: macos-14        # arm64 (Apple silicon)
            arch: arm64
          - runner: macos-13        # x86_64 (Intel)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Bundle
        run: cd packages/desktop && dx bundle --platform desktop --release --features desktop --package-types dmg
      - name: Name by architecture
        run: for f in target/dx/moonkale/bundle/**/*.dmg target/dx/moonkale/bundle/*/*/*.dmg; do [ -f "$f" ] && mv "$f" "${f%.dmg}-${{ matrix.arch }}.dmg" || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: target/dx/moonkale/bundle/**/*.dmg

  android:
    name: Android (arm64 APK) — debug-signed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865"
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - name: Pillow (launcher icons)
        run: pip3 install --user pillow
      - uses: Swatinem/rust-cache@v2
      - name: Build the APK (packages/mobile/build-android.sh)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: packages/mobile/build-android.sh
      - name: Name the artefact
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist && cp target/dx/mobile/release/android/app/app/build/outputs/apk/debug/app-debug.apk dist/moonkale-$VERSION-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  nix:
    name: Nix (flake build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - run: nix build .#default --print-build-logs

  release:
    name: GitHub Release
    # `always()`: the Windows, macOS and Android jobs have never run on GitHub
    # (nobody has the machines to test them); a failure there must not hold
    # back the Linux packages. The release notes say which jobs failed.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, arch, windows, macos, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      - name: Checksums
        run: cd artefacts && ls -la && sha256sum * > sha256sums.txt && cat sha256sums.txt
      - name: Note failed builds
        id: failed
        run: |
          failed=""
          for j in linux:${{ needs.linux.result }} arch:${{ needs.arch.result }} windows:${{ needs.windows.result }} macos:${{ needs.macos.result }} android:${{ needs.android.result }}; do
            case "$j" in *:success) ;; *) failed="$failed ${j%%:*}" ;; esac
          done
          echo "list=$failed" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: artefacts/*
          generate_release_notes: true
          body: |
            ${{ steps.failed.outputs.list != '' && format('**Builds that failed on the runners and are missing here:** {0}', steps.failed.outputs.list) || '' }}

            Packages for Linux (tarball, .deb, Arch), Android (arm64 APK, debug-signed), Windows (.msi / .exe, unsigned) and macOS (.dmg, unsigned).
            Install instructions: https://mathstruct.github.io/Moonkale/packaging/Install
