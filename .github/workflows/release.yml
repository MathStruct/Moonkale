name: Release packages

# Builds every package (Milestone 13) and attaches them to a GitHub Release.
#   - a tag `moonkale-YYMMDD-prototype-<hash>` (packaging/tag-release.sh) → a
#     release of that name, every file named `<tag>-<platform>.<ext>`
#   - an old-style tag `v*` → the same
#   - "Run workflow" by hand → the same artefacts as workflow artefacts, no release
# Linux: tarball + .deb + Arch package + AppImage. Windows: .msi + NSIS .exe.
# macOS: .dmg (x86_64 and arm64). Nix: `nix build` (verifies the flake).
# Windows and macOS bundles are UNSIGNED (see markdown/packaging/Install.md).

on:
  push:
    tags: ["moonkale-*", "v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write   # the container job publishes to ghcr.io

env:
  DX_VERSION: 0.7.10
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Release name
    runs-on: ubuntu-24.04
    outputs:
      # moonkale-260926-prototype-342cd5d: the tag, the release title and the
      # stem of every file name.
      release: ${{ steps.n.outputs.release }}
      # 260926.prototype.342cd5d: the version *inside* the .deb and the
      # pacman package, where hyphens are reserved.
      pkgver: ${{ steps.n.outputs.pkgver }}
    steps:
      - id: n
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            release="${{ github.ref_name }}"
          else
            # A manual run: named as if it were tagged now.
            release="moonkale-$(date -u +%y%m%d)-prototype-${GITHUB_SHA::7}"
          fi
          v="${release#moonkale-}"; v="${v#v}"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "pkgver=${v//-/.}" >> "$GITHUB_OUTPUT"
          echo "release $release, package version ${v//-/.}"

  linux:
    name: Linux (tarball, deb, AppImage)
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: System libraries (WebKitGTK 4.1 et al.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config binutils
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: MOONKALE_VERSION="${{ needs.meta.outputs.pkgver }}" packaging/build-release.sh --no-arch
      - name: AppImage (dx bundle)
        run: cd packages/desktop && dx bundle --platform desktop --release --features desktop --package-types appimage && cp ../../target/dx/moonkale/bundle/linux/appimage/*.AppImage ../../dist/ || echo "AppImage bundling failed (not fatal)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  arch:
    name: Arch Linux (pacman package)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      # Built **from source on Arch**, not repackaged from the Ubuntu tarball:
      # Arch ships xdotool 4 (`libxdo.so.4`) while Ubuntu 24.04 has
      # `libxdo.so.3`, so the repackaged binary did not start at all (P-129).
      - name: Tools
        run: |
          # rust-wasm: the browser client's wasm32 target. dx otherwise runs
          # `rustup target add`, and the container has no rustup ("No such
          # file or directory" after an 80-minute build).
          pacman -Syu --noconfirm --needed base-devel git sudo rust rust-wasm cargo pkgconf \
            webkit2gtk-4.1 gtk3 libayatana-appindicator xdotool openssl cmake python-pillow
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dioxus CLI (no AUR in the container)
        run: |
          curl -fsSL https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar -xz -C /usr/local/bin
          cargo-binstall -y --install-path /usr/local/bin dioxus-cli@${{ env.DX_VERSION }}
      - name: makepkg (as an unprivileged user — makepkg refuses root)
        run: |
          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Build the checked-out commit itself (the tag), not master.
          sudo -u builder env PATH="$PATH" MOONKALE_GIT_URL="file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA" \
            bash -c 'cd packaging/arch && makepkg -f --noconfirm --nodeps --skipchecksums'
          mkdir -p dist && mv packaging/arch/moonkale-*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  windows:
    name: Windows (msi, nsis) — unsigned
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Bundle
        run: cd packages/desktop && dx bundle --platform desktop --release --features desktop --package-types msi --package-types nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # Installers only: the bundle directory also holds the raw
          # `moonkale.exe`, which landed in the v0.1.0 release and confused
          # everyone who saw two .exe files (P-128).
          path: |
            target/dx/moonkale/bundle/**/*.msi
            target/dx/moonkale/bundle/**/*-setup.exe

  macos:
    name: macOS (dmg) — unsigned
    strategy:
      matrix:
        include:
          - runner: macos-14        # arm64 (Apple silicon)
            arch: arm64
          - runner: macos-15-intel  # x86_64 (Intel; macos-13 was retired and its jobs queue forever)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Bundle
        run: cd packages/desktop && dx bundle --platform desktop --release --features desktop --package-types dmg
      # No renaming: dx already puts the architecture in the name
      # (`Moonkale_0.1.0_aarch64.dmg`), and appending ours made
      # `…_aarch64-arm64.dmg` in v0.1.0 (P-128).
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: target/dx/moonkale/bundle/**/*.dmg

  android:
    name: Android (arm64 APK) — debug-signed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System libraries
        # `dx build --platform android` also builds the fullstack **server**
        # binary for the host (DuckDB, LadybugDB, Typst, wasmtime), so this
        # job needs the Linux job's dev packages plus cmake — LadybugDB falls
        # back to compiling its C++ when the prebuilt download fails.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config binutils cmake
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865"
      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - name: Pillow (launcher icons)
        run: pip3 install --user pillow
      - uses: Swatinem/rust-cache@v2
      - name: Release keystore (skipped when the secret is absent)
        # A stable signature, so one release installs over the last (P-131).
        # Without the secret the script falls back to a debug key and the
        # release notes below say so.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Whitespace stripped first: a secret pasted from a wrapped or
            # CRLF terminal failed with "base64: invalid input".
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks" \
              || { echo "::error::ANDROID_KEYSTORE_BASE64 is not base64 — set it with: base64 -w0 release.jks | gh secret set ANDROID_KEYSTORE_BASE64"; exit 1; }
            # Fail here, with a readable message, rather than 20 minutes later
            # inside Gradle: a truncated secret or a wrong password shows up now.
            keytool -list -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null \
              || { echo "::error::ANDROID_KEYSTORE_BASE64 is not a keystore, or ANDROID_KEYSTORE_PASSWORD is wrong"; exit 1; }
            echo "MOONKALE_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — the APK gets a throwaway debug key and will not install over an earlier release (P-131)."
          fi
      - name: Build the APK (packages/mobile/build-android.sh)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          MOONKALE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MOONKALE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MOONKALE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # --verbose (dx has no short -v): dx hides cargo's error text otherwise; the
        # first run of this job failed with nothing but "cargo build finished with errors".
        run: DX_BUILD_ARGS=--verbose packages/mobile/build-android.sh
      - name: Name the artefact
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          OUT=target/dx/mobile/release/android/app/app/build/outputs/apk
          APK="$OUT/release/app-release.apk"; [ -f "$APK" ] || APK="$OUT/debug/app-debug.apk"
          mkdir -p dist && cp "$APK" dist/moonkale-$VERSION-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  container:
    name: Container image (ghcr.io/moonkale-server)
    needs: [meta, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        # The image only repackages the tarball's `moonkale-server`; it is what
        # the repository's **Packages** sidebar lists. Pushed for tags only —
        # a manual run builds it and stops.
        run: |
          VERSION="${{ needs.meta.outputs.release }}"; VERSION="${VERSION#moonkale-}"
          TARBALL=$(ls dist/moonkale-*-linux-x86_64.tar.gz | head -1)
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')/moonkale-server
          docker build -f packaging/Dockerfile --build-arg TARBALL="$TARBALL" -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          # Smoke test: the binary runs and prints its version, then exits.
          docker run --rm "$IMAGE:$VERSION" --version
          if [ "${{ github.ref_type }}" = tag ]; then
            docker push "$IMAGE:$VERSION" && docker push "$IMAGE:latest"
          else
            echo "not a tag — built but not pushed"
          fi

  nix:
    name: Nix (flake build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # A binary cache, so this stops costing ~1 h 50 m per tag and so users
      # of `nix run github:MathStruct/Moonkale` download instead of compile.
      # Free for open source (5 GB). Without the secret the step still works:
      # it pulls from the public cache and skips the push.
      - uses: cachix/cachix-action@v15
        with:
          name: moonkale
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only the app's own closure; the toolchain would fill 5 GB fast.
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$|\\.drv$)"
        continue-on-error: true
      # The Nix store between runs, when no Cachix token is configured: the
      # GitHub Actions cache is free and needs no account (10 GB per repo).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 604800
        continue-on-error: true
      - run: nix build .#default --print-build-logs

  release:
    name: GitHub Release
    # `always()`: the Windows, macOS and Android jobs have never run on GitHub
    # (nobody has the machines to test them); a failure there must not hold
    # back the Linux packages. The release notes say which jobs failed.
    if: always() && github.ref_type == 'tag' && needs.meta.result == 'success'
    needs: [meta, linux, arch, windows, macos, android, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      - name: Collect the files and checksum them
        # `merge-multiple` keeps each artifact's directory structure (the
        # macOS bundles arrive under `bundle/**`), so `sha256sum *` hit a
        # directory and killed the whole release (P-127). Flatten first.
        run: |
          mkdir -p release
          find artefacts -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.pkg.tar.*' \
            -o -name '*.AppImage' -o -name '*.apk' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.dmg' \) -exec mv -t release {} + || true
          cd release
          ls -la
          if [ -z "$(ls -A)" ]; then echo "no artefacts at all — nothing built"; exit 1; fi
          # One naming scheme for every file: <release>-<platform>.<ext>. The
          # builds name them after the package version (dx: Cargo.toml's
          # 0.1.0, which the .msi needs numeric), so rename here, once.
          R="${{ needs.meta.outputs.release }}"
          for f in *; do
            case "$f" in
              *.pkg.tar.*)        n="$R-arch-x86_64.pkg.tar.${f##*.pkg.tar.}" ;;
              *-linux-*.tar.gz)   n="$R-linux-x86_64.tar.gz" ;;
              *.deb)              n="$R-debian-amd64.deb" ;;
              *.AppImage)         n="$R-linux-x86_64.AppImage" ;;
              *.apk)              n="$R-android-arm64.apk" ;;
              *.msi)              n="$R-windows-x64.msi" ;;
              *-setup.exe)        n="$R-windows-x64-setup.exe" ;;
              *aarch64*.dmg)      n="$R-macos-arm64.dmg" ;;
              *.dmg)              n="$R-macos-x86_64.dmg" ;;
              *)                  n="$f" ;;
            esac
            [ "$f" = "$n" ] || mv -v "$f" "$n"
          done
          sha256sum * > sha256sums.txt
          cat sha256sums.txt
      - name: Note failed builds
        id: failed
        run: |
          failed=""
          for j in linux:${{ needs.linux.result }} arch:${{ needs.arch.result }} windows:${{ needs.windows.result }} macos:${{ needs.macos.result }} android:${{ needs.android.result }} container:${{ needs.container.result }}; do
            case "$j" in *:success) ;; *) failed="$failed ${j%%:*}" ;; esac
          done
          echo "list=$failed" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.meta.outputs.release }}
          files: release/*
          generate_release_notes: true
          body: |
            ${{ steps.failed.outputs.list != '' && format('**Builds that failed on the runners and are missing here:** {0}', steps.failed.outputs.list) || '' }}

            A prototype: expect breaking changes between releases.

            Packages for Linux (tarball, .deb, Arch — built on Arch), Android (arm64 APK, debug-signed), Windows (.msi / .exe, unsigned) and macOS (.dmg, unsigned).
            Install instructions: https://mathstruct.github.io/Moonkale/packaging/Install
