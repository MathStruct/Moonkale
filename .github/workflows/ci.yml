name: CI

# Milestone 18, phase 0: the safety net for the library refactor.
#   lint  — rustfmt, the layering rules (tools/check-deps.py), the colour ratchet (tools/check-colors.py)
#   test  — cargo test, clippy -D warnings, the web client for wasm32
#   e2e   — a smoke batch of the browser suites against `dx serve`
# Tags are built by release.yml, not here.

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds once from scratch (or a restored cache): incremental artefacts
  # and debug info only cost disk on the runner.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  DX_VERSION: 0.7.10

jobs:
  lint:
    name: fmt + layering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Layering rules (tools/deps-allow.txt lists today's known violations)
        run: python3 tools/check-deps.py
      - name: No new hard-coded colours outside the theme (spec 030 prep)
        run: python3 tools/check-colors.py
      - name: UI strings in English, German and Chinese, every id used and defined (spec 030)
        run: python3 tools/check-strings.py
      - name: Vault front matter parses (one bad page stops the site build)
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
          python3 tools/check-frontmatter.py

  content-id-dependencies:
    name: Content-id dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-content-id-audit
      - name: Install pinned dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit the new hashing dependency and its locked dependency graph
        run: python3 tools/check-content-id-deps.py

  security:
    name: Dependency security + vendored checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Security gate regression tests (offline)
        run: python3 tools/test-security.py
      - name: Install pinned Rust auditors
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Rust licences, sources and advisories (shared dated exceptions)
        run: python3 tools/check-security.py rust
      - name: Every JS lockfile (production graph, high and critical block)
        if: ${{ !cancelled() }}
        run: python3 tools/check-security.py js
      - name: Reviewed vendored SHA-256 manifest (offline)
        if: ${{ !cancelled() }}
        run: python3 tools/check-vendored.py

  fuzz:
    name: Fuzz ${{ matrix.target }} (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [math_delimiters, flow_format]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/fuzz
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-09-29
          components: rust-src, rustfmt
      - name: Install pinned fuzz runner
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Parser regression tests (same production source, no UI)
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo test --manifest-path fuzz/Cargo.toml --locked --lib
      - name: Fuzz for 60 seconds
        run: |
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -max_len=65536 -rss_limit_mb=2048 -timeout=10
          git diff --exit-code -- fuzz/Cargo.lock
      - name: Retain crashes for normal-suite regression tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  math-renderer:
    name: KaTeX renderer + bundle consistency
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/js/katex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/js/katex/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm run build && npm test
      - name: Committed renderer matches its source
        run: git -C "$GITHUB_WORKSPACE" diff --exit-code -- packages/ext-api/assets/katex-renderer.js

      - name: CodeMirror typecheck and committed bundle consistency
        working-directory: packages/js/codemirror
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- packages/code-view/assets/codemirror.js

  portable:
    name: Portable ${{ matrix.os }} (advisory)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: ci-portable-${{ runner.os }}-${{ runner.arch }}
      - name: Platform branches and filesystem tests
        run: cargo test -p moonkale-core -p moonkale-project-fs -p moonkale-index -p moonkale-content-id -p moonkale-ext-api -p moonkale-llm -p moonkale-sources-unison -p moonkale-sources-sophia --locked
      - name: Remote platform branches (library tests; SSH shim requires Unix)
        if: ${{ !cancelled() }}
        run: cargo test -p moonkale-remote --lib --locked
      # release.yml uses desktop's default distribution features, without julia.
      # LadybugDB is a Linux-only desktop dependency (P-144), not a distribution feature.
      - name: Desktop extension distribution (release defaults)
        if: ${{ !cancelled() }}
        run: cargo check -p moonkale-distribution --locked

  test:
    name: test + clippy + wasm check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (a clean workspace build needs ~30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          # rust-analyzer: packages/services/lsp-local/tests/rust_analyzer.rs talks to a real one.
          components: clippy, rust-analyzer
      - name: System libraries (WebKitGTK 4.1, libxdo; clang for RocksDB's bindgen and wasm C code)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config binutils clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
      - name: cargo test
        run: cargo test --workspace --locked
      - name: Sophia folder history replay (hermetic)
        run: cargo test -p moonkale-index --features sophia --test history_replay --locked
      - name: Content identities and lossless Rust syntax (off by default)
        run: |
          cargo test -p moonkale-index --features content-ids,lossless-syntax --locked
          cargo clippy -p moonkale-index --features content-ids,lossless-syntax --all-targets --locked -- -D warnings
      - name: Experimental structural planner and graph review
        run: |
          cargo test -p moonkale-server -p moonkale-editor-graph --features moonkale-server/structural-edits,moonkale-editor-graph/structural-edits --locked
          cargo clippy -p moonkale-server -p moonkale-editor-graph --features moonkale-server/structural-edits,moonkale-editor-graph/structural-edits --all-targets --locked -- -D warnings
          cargo check -p desktop --features structural-edits --locked
          cargo check -p web --target wasm32-unknown-unknown --features web,structural-edits --locked
      - name: The wasm runtime with the example extension (feature wasmtime is off by default)
        run: cargo test -p moonkale-ext-host --features wasmtime --locked
      - name: The state store's reference (redb) and recommended (SQLite) backends through the conformance suite
        run: cargo test -p moonkale-state -p moonkale-state-stores --features moonkale-state-stores/redb,moonkale-state-stores/sqlite --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: The minimum distribution (no optional extension) builds
        run: cargo check -p moonkale-distribution --no-default-features --locked
      - name: The distribution with Lux.jl from MathStruct/moonkale-julia (by tag, feature julia)
        run: cargo check -p moonkale-distribution --features julia --locked
      - name: The library crates' docs build without warnings (Milestone 18 phase 6.3)
        run: cargo doc -p moonkale-core -p moonkale-ext-api -p moonkale-graph-render --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Web client compiles for wasm32 (no native-only crate leaked in)
        run: cargo check -p web --target wasm32-unknown-unknown --features web --locked
      - run: df -h /
        if: always()

  e2e:
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            check_name: browser smoke suites
            features: julia,rocksdb,helix,crash-test
            browser: firefox chromium
            suites: density mouse keymaps journey-keyboard journey-mouse shortcut-discovery crash-safety files rich stores palette shell wiki live-preview-math live-preview-callouts live-preview-wiki-hover live-preview-properties doc-preview
          - name: structural
            check_name: browser structural edits
            features: julia,structural-edits
            browser: chromium
            suites: structural-edits graph-rename group-history graph-a11y
          # ADR-0029 gate 3: the web client reads the Sophia folder store through the server.
          - name: sophia
            check_name: browser Sophia folder store
            features: sophia
            browser: chromium
            suites: sophia-folder
    env:
      # Both attempts share one hour; only 20 minutes of inactivity triggers a retry.
      SERVE_WAIT: 3600
      SERVE_ATTEMPTS: 2
      # Keep the list short: each suite drives the real app; the full set is run-all.sh without arguments.
      SUITES: ${{ matrix.suites }}
      SERVE_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v4
      - name: Startup recovery tests
        run: python3 packages/web/tests/e2e/test-serve.py
      - name: Working directory for the suites
        run: echo "MOONKALE_E2E=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config binutils clang libclang-dev
      - uses: cargo-bins/cargo-binstall@c06f6a0003f7c6165a00c89d1697731c9e8a5c72 # v1.25.2 (pinned, audit #19)
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (${{ matrix.browser }})
        run: |
          mkdir -p "$MOONKALE_E2E/e2e"
          cd "$MOONKALE_E2E/e2e" && npm init -y >/dev/null && npm i playwright && npm audit --omit=dev --audit-level=high && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Rust analyzer for graph rename
        if: matrix.name == 'structural'
        run: rustup component add rust-analyzer
      - name: Fixture
        run: packages/web/tests/e2e/fixture.sh "$MOONKALE_E2E/m2root"
      - name: Start the web build (dx serve)
        # A cold cache (after a Cargo.lock change) rebuilds the bundled C++
        # stores (DuckDB, RocksDB, LadybugDB) and takes longer than serve.sh's
        # 20-minute default; a real stall is still caught by SERVE_STALL (no
        # change in the dx log or the target dir for 20 minutes).
        timeout-minutes: 70
        run: packages/web/tests/e2e/serve.sh start
      - name: Suites
        run: packages/web/tests/e2e/run-all.sh $SUITES
      - name: Structural edits with CodeMirror
        if: matrix.name == 'structural'
        env:
          STRUCTURAL_EDITOR: codemirror
        run: packages/web/tests/e2e/run-all.sh structural-edits graph-rename
      - name: Server log and screenshots on failure
        if: failure()
        run: tail -n 100 "$MOONKALE_E2E"/dx-*.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/e2e/shots
            ${{ runner.temp }}/e2e/dx-*.log
          retention-days: 7
      - name: Stop the server
        if: always()
        run: packages/web/tests/e2e/serve.sh stop
