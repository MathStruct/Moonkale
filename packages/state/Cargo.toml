[package]
name = "moonkale-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The store for Moonkale's own state (Milestone 18 phase 3, ADR-0014): one small key/value interface, an order-preserving key encoding, versioned records, a conformance suite, and redb as the reference backend."

[features]
default = []
redb = ["dep:redb"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redb = { version = "4", optional = true }

[dev-dependencies]
tempfile = "3"
