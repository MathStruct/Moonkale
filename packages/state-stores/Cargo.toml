[package]
name = "moonkale-state-stores"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The engines behind moonkale-state's StateStore: SQLite (the app's, ADR-0014), and redb, Turso, RocksDB, HelixDB from the comparison of Milestone 18 phase 5. One feature each; only the apps depend on this crate."

[features]
default = []
redb = ["dep:redb"]
sqlite = ["dep:rusqlite"]
turso = ["dep:turso", "dep:tokio"]
rocksdb = ["dep:rocksdb"]
helix = ["dep:helix-db", "dep:tokio", "dep:base64"]

[dependencies]
moonkale-state = { workspace = true }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redb = { version = "4", optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
turso = { version = "0.7", optional = true }
rocksdb = { version = "0.25", optional = true }
helix-db = { git = "https://github.com/HelixDB/helix-db", rev = "f0d1b554f4", features = ["embedded"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"
