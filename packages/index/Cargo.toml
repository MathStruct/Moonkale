[package]
name = "moonkale-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parsing and indexing: wiki-links and tree-sitter symbols derived from other sources, exposed as a Source. Native only."

[dependencies]
moonkale-core = { workspace = true }
regex = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
moonkale-project-fs = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
