[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

# The binary (and therefore dx's product name, "Moonkale") is what packages
# install as /usr/bin/moonkale with assets in /usr/lib/Moonkale/assets.
[[bin]]
name = "moonkale"
path = "src/main.rs"

[dependencies]
# The store for this app's own state (ADR-0014): SQLite.
moonkale-state = { workspace = true }
moonkale-state-stores = { workspace = true, features = ["sqlite"] }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
dioxus = { workspace = true, features = ["fullstack"] }
moonkale-shell = { workspace = true }
moonkale-distribution = { workspace = true }
moonkale-editor-markdown = { workspace = true }
moonkale-core = { workspace = true }
moonkale-code-view = { workspace = true }
moonkale-project-fs = { workspace = true }
moonkale-sources = { workspace = true }
moonkale-index = { workspace = true }
moonkale-sources-sql = { workspace = true, features = ["sqlite", "duckdb", "turso"] }
# Milestone 17: embedded HelixDB, redb, RocksDB. LadybugDB on Linux only (the
# target table below): its static library can be linked next to them only
# with its bundled symbols localized, an ELF-only step (.cargo/config.toml).
moonkale-sources-graph = { workspace = true, features = ["helix"] }
moonkale-sources-kv = { workspace = true, features = ["redb", "rocksdb"] }
moonkale-terminal = { workspace = true }
moonkale-terminal-pty = { workspace = true }
moonkale-typst = { workspace = true }
moonkale-lsp = { workspace = true }
moonkale-lsp-local = { workspace = true }
moonkale-llm = { workspace = true, features = ["http", "claude-code"] }
moonkale-server = { workspace = true }
moonkale-remote = { workspace = true }
moonkale-ext-host = { workspace = true, features = ["wasmtime"] }
moonkale-ext-git = { workspace = true, features = ["cli"] }
serde_json = "1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
# Native folder dialog. Same backend dioxus-desktop uses (xdg-desktop-portal on
# Linux); see packages/desktop/desktop.md for the portal requirement.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[features]
default = []
desktop = ["dioxus/desktop", "moonkale-code-view/native-desktop"]
server = ["dioxus/server", "moonkale-server/server", "moonkale-distribution/server"]
# Lux.jl from MathStruct/moonkale-julia (Milestone 18 phase 6.4); off by default.
julia = ["moonkale-distribution/julia"]


[target.'cfg(target_os = "linux")'.dependencies]
moonkale-sources-graph = { workspace = true, features = ["helix", "ladybug"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"

# Windows has no system OpenSSL, and `dioxus-desktop` depends on
# `tungstenite` with `native-tls` (not optional, P-125) → `openssl-sys`.
# `vendored` compiles OpenSSL from source with perl + nasm, both preinstalled
# on GitHub's Windows runners. Windows only: Linux and macOS use theirs.
[target.'cfg(windows)'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
