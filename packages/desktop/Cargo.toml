[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

# The binary (and therefore dx's product name, "Moonkale") is what packages
# install as /usr/bin/moonkale with assets in /usr/lib/Moonkale/assets.
[[bin]]
name = "moonkale"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
ui = { workspace = true }
moonkale-core = { workspace = true }
moonkale-project-fs = { workspace = true }
moonkale-sources = { workspace = true }
moonkale-index = { workspace = true }
moonkale-sources-sql = { workspace = true, features = ["sqlite"] }
moonkale-sources-graph = { workspace = true, features = ["ladybug"] }
moonkale-terminal = { workspace = true }
moonkale-terminal-pty = { workspace = true }
moonkale-typst = { workspace = true }
moonkale-lsp = { workspace = true }
moonkale-lsp-local = { workspace = true }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
# Native folder dialog. Same backend dioxus-desktop uses (xdg-desktop-portal on
# Linux); see packages/desktop/desktop.md for the portal requirement.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[features]
default = []
desktop = ["dioxus/desktop"]
server = ["dioxus/server", "ui/server"]
