[package]
name = "moonkale-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language Server Protocol client core: transport-agnostic session, document sync, feature requests. Runs on all platforms."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
lsp-types = "0.97"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
