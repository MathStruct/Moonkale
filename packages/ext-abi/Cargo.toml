[package]
name = "moonkale-ext-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The JSON shapes of the wasm extension ABI v1 (manifest, run, host calls). No dependencies beyond serde: shared by the host runtime, the extension contract and extensions written in Rust."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
