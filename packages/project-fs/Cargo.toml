[package]
name = "moonkale-project-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Folder projects as a Source: file tree, content, atomic writes. Native backend (desktop, server)."

[dependencies]
moonkale-core = { workspace = true }
ignore = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["fs", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
