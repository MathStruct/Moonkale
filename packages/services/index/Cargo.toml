[package]
name = "moonkale-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parsing and indexing: wiki-links and tree-sitter symbols derived from other sources, exposed as a Source. Native only."

[dependencies]
moonkale-core = { workspace = true }
moonkale-llm = { workspace = true }
regex = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The tree-sitter runtime and grammars come from arborium (tree-sitter
# compiled to Rust and wasm): one runtime for the index and the Rust code
# editor (`dioxus-code` links the same C library; Cargo allows one — P-113),
# and the grammars are `LanguageFn`s like upstream's.
arborium-tree-sitter = "2.18"
arborium-rust = "2.18"
arborium-julia = "2.18"
arborium-python = "2.18"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
moonkale-project-fs = { workspace = true }
moonkale-llm = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
