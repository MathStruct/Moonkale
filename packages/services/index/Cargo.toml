[package]
name = "moonkale-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parsing and indexing: wiki-links and tree-sitter symbols derived from other sources, exposed as a Source. Native only."

[features]
default = []
sophia = ["content-ids", "dep:sophia-store", "dep:sophia-hash", "dep:toml"]
lossless-syntax = ["dep:blake3"]
content-ids = ["dep:blake3", "dep:moonkale-content-id", "dep:moonkale-state", "dep:serde", "dep:serde_json"]

[dependencies]
moonkale-core = { workspace = true }
moonkale-llm = { workspace = true }
regex = "1"
blake3 = { version = "1", optional = true }
moonkale-state = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The tree-sitter runtime and grammars come from arborium (tree-sitter
# compiled to Rust and wasm): one runtime for the index and the Rust code
# editor (`dioxus-code` links the same C library; Cargo allows one — P-113),
# and the grammars are `LanguageFn`s like upstream's.
arborium-tree-sitter = "2.18"
arborium-rust = "2.18"
arborium-julia = "2.18"
arborium-python = "2.18"
# WP-66 normal form and hashing, shared with Sophia (SR-116).
moonkale-content-id = { workspace = true, optional = true }
sophia-store = { git = "https://github.com/MathStruct/Sophia.git", tag = "v0.1.2", default-features = false, features = ["sqlite"], optional = true }
sophia-hash = { git = "https://github.com/MathStruct/Sophia.git", tag = "v0.1.2", optional = true }
toml = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
moonkale-project-fs = { workspace = true }
moonkale-llm = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
moonkale-sources-sophia = { workspace = true }
