[package]
name = "moonkale-trace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stack traces and compiler output as graphs: parsers (Rust, cargo, Python, JS) and an in-memory Source. All platforms."

[dependencies]
moonkale-core = { workspace = true }
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
