[package]
name = "moonkale-terminal-pty"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop/server only: local PTY backend for terminal sessions."

[dependencies]
moonkale-terminal = { workspace = true }
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
portable-pty = "0.9"

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
