[package]
name = "moonkale-project-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Folder projects as a Source: file tree, content, atomic writes. Native backend (desktop, server)."

[dependencies]
moonkale-core = { workspace = true }
ignore = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = "8.2.0"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# renameat2(RENAME_NOREPLACE): a rename that never replaces (#15).
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
