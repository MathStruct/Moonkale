[package]
name = "moonkale-editor-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The in-app agent: chat panel, tools over the workspace, policy prompts, audit, transcripts as pages. Milestone 4."

[dependencies]
dioxus = { workspace = true }
moonkale-core = { workspace = true }
moonkale-ext-api = { workspace = true }
moonkale-llm = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }
