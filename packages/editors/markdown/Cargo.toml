[package]
name = "moonkale-editor-markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Markdown / Typst editing: backlinks and links panel (Milestone 2); WYSIWYG and Typst preview later."

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
moonkale-core = { workspace = true }
moonkale-ext-api = { workspace = true }
moonkale-code-view = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-timer = { version = "3", features = ["wasm-bindgen"] }
tracing = "0.1"

[features]
default = []
# The server half (Milestone 18 phase 4.3): Typst compiles on the server.
server = ["dioxus/server", "dep:moonkale-typst", "dep:moonkale-server-host", "dep:tokio"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moonkale-typst = { workspace = true, optional = true }
moonkale-server-host = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
