[package]
name = "moonkale-editor-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Graph view panel: hosts the wgpu renderer module (graph-render) and feeds it the index."

[dependencies]
dioxus = { workspace = true }
moonkale-core = { workspace = true }
moonkale-ext-api = { workspace = true }
moonkale-graph-assets = { workspace = true }
moonkale-trace = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

moonkale-code-view = { workspace = true, optional = true }

[features]
# Experimental Rust structural edit previews; off by default.
structural-edits = ["dep:moonkale-code-view"]

[dev-dependencies]
moonkale-sources-unison = { workspace = true }
moonkale-sources-sophia = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
