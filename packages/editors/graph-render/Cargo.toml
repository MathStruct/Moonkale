[package]
name = "moonkale-graph-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The graph view renderer: a standalone wasm module (wgpu + force layout + hit-testing) loaded into the web page or the desktop webview."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d",
    "MouseEvent", "PointerEvent", "WheelEvent", "DomRect", "CssStyleDeclaration", "TextMetrics",
] }
wgpu = { version = "30", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
console_error_panic_hook = "0.1"
