[package]
name = "moonkale-editor-flow"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "No-code / low-code flow editor: drag-and-drop blocks wired by typed ports, on dioxus-flow. Block libraries come from extensions (e.g. the optional Lux.jl one). Milestone 6."

[dependencies]
dioxus = { workspace = true }
dioxus-flow = "0.1.2"
moonkale-core = { workspace = true }
moonkale-ext-api = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
