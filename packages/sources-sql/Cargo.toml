[package]
name = "moonkale-sources-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQL sources: SQLite (Milestone 2), DuckDB + data folders (Milestone 9); Postgres/Supabase, Turso/libSQL later. Native only."

[features]
default = []
sqlite = ["dep:rusqlite", "dep:tokio"]
postgres = []
duckdb = ["dep:duckdb", "dep:tokio", "dep:tracing"]
turso = []

[dependencies]
moonkale-core = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
duckdb = { version = "1", features = ["bundled"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
