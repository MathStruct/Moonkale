[package]
name = "moonkale-lsp-local"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop/server only: spawn local language servers over stdio (Content-Length framing) and find them."

[dependencies]
moonkale-lsp = { workspace = true }
futures-channel = "0.3"

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tempfile = "3"
