[package]
name = "moonkale-sources-kv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Key/value sources: redb and RocksDB (embedded), Redis/Dragonfly (planned). Native only."

[features]
default = []
redis = []
redb = ["dep:redb", "dep:tokio"]
rocksdb = ["dep:rocksdb", "dep:tokio"]

[dependencies]
moonkale-core = { workspace = true }
# moonkale-sources = { workspace = true }
# redis = { version = "1", features = ["tokio-comp"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Milestone 17: embedded key/value stores.
redb = { version = "4", optional = true }
rocksdb = { version = "0.25", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
tempfile = "3"
# The tests create the stores they open.
redb = "4"
rocksdb = "0.25"
# examples/seed_stores.rs (the E2E fixture) creates a Turso and a Helix store too.
turso = "0.7"
helix-db = { git = "https://github.com/HelixDB/helix-db", rev = "f0d1b554f4", features = ["embedded"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "seed_stores"
required-features = ["redb", "rocksdb"]
