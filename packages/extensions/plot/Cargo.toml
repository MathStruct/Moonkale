[package]
name = "moonkale-ext-plot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded Rust SVG quick-look plots of table results."

[dependencies]
dioxus = { workspace = true }
moonkale-core = { workspace = true }
moonkale-ext-api = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
moonkale-project-fs = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
