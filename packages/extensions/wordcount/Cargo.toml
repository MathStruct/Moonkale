[package]
name = "moonkale-ext-wordcount"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Example third-party extension: a wasm core module (ABI v1) that counts words in a file through host calls. Build: packages/extensions/wordcount/build.sh"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
moonkale-ext-host = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
