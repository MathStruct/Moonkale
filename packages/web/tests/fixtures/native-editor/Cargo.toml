[package]
name = "moonkale-native-editor-host"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "macro", "html", "signals", "hooks", "document", "asset"] }
moonkale-code-view = { path = "../../../../code-view", features = ["layout-fixture"] }
moonkale-ext-api = { path = "../../../../ext-api" }
moonkale-core = { path = "../../../../core" }

moonkale-lsp = { path = "../../../../services/lsp" }
moonkale-lsp-local = { path = "../../../../services/lsp-local", optional = true }
futures-channel = "0.3"
serde_json = "1"

futures-timer = { version = "3", features = ["wasm-bindgen"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "moonkale-code-view/native-desktop", "dep:moonkale-lsp-local"]

# Keep the parser runtime responsive in interactive development builds too.
[profile.dev.package.arborium-tree-sitter]
opt-level = 2

# Preview indexing and syntax queries run on the input path.
[profile.dev.package.moonkale-code-view]
opt-level = 1

[profile.dev.package.dioxus-code]
opt-level = 2
