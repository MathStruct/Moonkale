[package]
name = "moonkale-sources-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Graph-database sources: TypeDB, LadybugDB (lbug), HelixDB (embedded or HTTP), FalkorDB. Native only."

[features]
default = []
typedb = []
ladybug = ["dep:lbug", "dep:tokio"]
helix = ["dep:helix-db", "dep:tokio", "dep:serde_json"]
falkor = []

[dependencies]
moonkale-core = { workspace = true }
# typedb-driver = { version = "3", optional = true }
# helix-db = { version = "3", features = ["embedded"], optional = true }  # embedded mode; server mode is plain HTTP POST /v2/query
# falkordb = { version = "0.10", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# LadybugDB official Rust binding (formerly kuzu). Downloads a prebuilt static
# liblbug (~40 MB linked in), else builds C++ (needs cmake). Extensions
# (FTS, vector) need extra link flags; not enabled.
lbug = { version = "0.21", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
# HelixDB embedded (Milestone 17, spec 002): the engine (`crates/db`) is not on
# crates.io, so a git dependency pinned to a commit of 2026-09-28. Heavy tree
# (SlateDB fork, tantivy, object_store, …); desktop and server only.
helix-db = { git = "https://github.com/HelixDB/helix-db", rev = "f0d1b554f4", features = ["embedded"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
helix-db = { git = "https://github.com/HelixDB/helix-db", rev = "f0d1b554f4", features = ["embedded"] }

# Seeds the E2E fixture's LadybugDB (packages/web/tests/e2e/fixture.sh).
[[example]]
name = "seed_people"
required-features = ["ladybug"]
