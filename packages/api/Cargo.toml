[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
moonkale-core = { workspace = true }
moonkale-terminal = { workspace = true }
moonkale-lsp = { workspace = true }
moonkale-llm = { workspace = true }
moonkale-ext-host = { workspace = true }
moonkale-ext-git = { workspace = true }
moonkale-ext-api = { workspace = true }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
base64 = "0.22"
serde_json = "1"
http = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moonkale-sources = { workspace = true, optional = true }
moonkale-project-fs = { workspace = true, optional = true }
moonkale-index = { workspace = true, optional = true }
moonkale-sources-sql = { workspace = true, optional = true, features = ["sqlite", "duckdb"] }
moonkale-sources-graph = { workspace = true, optional = true, features = ["ladybug"] }
moonkale-terminal-pty = { workspace = true, optional = true }
moonkale-typst = { workspace = true, optional = true }
moonkale-lsp-local = { workspace = true, optional = true }
# tokio is needed on every native target: the server, and the desktop's client
# relay (Milestone 11) — a loopback listener the server functions always point
# at, piped to the active remote (TLS for https).
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
axum = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[features]
server = ["dioxus/server", "dep:moonkale-sources", "dep:moonkale-project-fs", "dep:moonkale-index", "dep:moonkale-sources-sql", "dep:moonkale-sources-graph", "dep:moonkale-terminal-pty", "dep:moonkale-typst", "dep:moonkale-lsp-local", "moonkale-llm/http", "dep:axum", "moonkale-ext-host/wasmtime", "moonkale-ext-git/cli"]
