[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
moonkale-core = { workspace = true }
moonkale-terminal = { workspace = true }
moonkale-lsp = { workspace = true }
moonkale-llm = { workspace = true }
moonkale-ext-host = { workspace = true }
moonkale-ext-git = { workspace = true }
moonkale-ext-api = { workspace = true }
moonkale-state = { workspace = true }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
base64 = "0.22"
serde_json = "1"
http = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moonkale-sources = { workspace = true, optional = true }
moonkale-project-fs = { workspace = true, optional = true }
moonkale-index = { workspace = true, optional = true }
moonkale-sources-sql = { workspace = true, optional = true, features = ["sqlite", "duckdb", "turso"] }
moonkale-sources-graph = { workspace = true, optional = true, features = ["helix"] }
moonkale-sources-kv = { workspace = true, optional = true, features = ["redb", "rocksdb"] }
moonkale-terminal-pty = { workspace = true, optional = true }
moonkale-typst = { workspace = true, optional = true }
moonkale-lsp-local = { workspace = true, optional = true }
# The host's state store (phase 5.10): the server's `state.sqlite`.
moonkale-state-stores = { workspace = true, optional = true, features = ["sqlite"] }
# tokio is needed on every native target: the server, and the desktop's client
# relay (Milestone 11) — a loopback listener the server functions always point
# at, piped to the active remote (TLS for https).
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
axum = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

# LadybugDB on Linux only (P-144): its static library can share the server
# binary with Turso/HelixDB/RocksDB only with its bundled symbols localized,
# an ELF-only step (.cargo/config.toml).
[target.'cfg(target_os = "linux")'.dependencies]
moonkale-sources-graph = { workspace = true, optional = true, features = ["helix", "ladybug"] }

[features]
server = ["dioxus/server", "dep:moonkale-sources", "dep:moonkale-project-fs", "dep:moonkale-index", "dep:moonkale-sources-sql", "dep:moonkale-sources-graph", "dep:moonkale-sources-kv", "dep:moonkale-terminal-pty", "dep:moonkale-typst", "dep:moonkale-lsp-local", "dep:moonkale-state-stores", "moonkale-llm/http", "moonkale-llm/claude-code", "dep:axum", "moonkale-ext-host/wasmtime", "moonkale-ext-git/cli"]

[dev-dependencies]
tempfile = "3"
