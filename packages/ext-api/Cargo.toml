[package]
name = "moonkale-ext-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The stable API surface an extension programs against: manifest, contribution points, host handle."

[dependencies]
moonkale-core = { workspace = true }
moonkale-terminal = { workspace = true }
moonkale-lsp = { workspace = true }
moonkale-llm = { workspace = true }
moonkale-ext-host = { workspace = true }
dioxus = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
