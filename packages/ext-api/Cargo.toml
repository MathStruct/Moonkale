[package]
name = "moonkale-ext-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The stable API surface an extension programs against: manifest, contribution points, host handle."

[dependencies]
moonkale-core = { workspace = true }
moonkale-terminal = { workspace = true }
moonkale-lsp = { workspace = true }
moonkale-llm-types = { workspace = true }
moonkale-state = { workspace = true }
moonkale-ext-abi = { workspace = true }
dioxus = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
uuid = { version = "1", features = ["v4", "js"] }
futures-timer = { version = "3.0.4", features = ["wasm-bindgen"] }
# Spec 030: strings per language (Fluent: plurals and variables for German,
# Chinese), and the system's language as the default.
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
sys-locale = { version = "0.3", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
dioxus-core = "0.7.10"
moonkale-project-fs = { workspace = true }
tempfile = "3"
