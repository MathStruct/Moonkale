[package]
name = "moonkale-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Standalone: normal workspace builds neither resolve libFuzzer nor need nightly.
[workspace]

[dependencies]
moonkale-core = { path = "../packages/core" }
moonkale-graph-render = { path = "../packages/graph-render" }
libfuzzer-sys = "=0.4.13"
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[[bin]]
name = "math_delimiters"
path = "fuzz_targets/math_delimiters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flow_format"
path = "fuzz_targets/flow_format.rs"
test = false
doc = false
bench = false

# The same patched parser as the app (P-212; see the root Cargo.toml).
[patch.crates-io]
pulldown-cmark = { path = "../packages/code-view/vendor/pulldown-cmark" }

[[bin]]
name = "egraph"
path = "fuzz_targets/egraph.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed_cells"
path = "fuzz_targets/typed_cells.rs"
test = false
doc = false
bench = false

[[bin]]
name = "symbol_paths"
path = "fuzz_targets/symbol_paths.rs"
test = false
doc = false
bench = false
