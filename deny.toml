# WP-47: check the entire optional/platform graph, without changing Cargo.lock.
[graph]
all-features = true

[advisories]
# Shared with cargo-audit by tools/check-security.py. Dates are review dates,
# not claims that these issues are fixed. Daniel decides dependency upgrades.
ignore = [
    { crate = "yoke-derive@0.8.3", reason = "2026-10-17: existing yanked transitive Unicode derive crate; upgrade deferred to Daniel (WP-47)." },
    { id = "RUSTSEC-2026-0194", reason = "2026-10-17: existing quick-xml 0.38.4: Quadratic run time when checking a start tag for duplicate attribute names; upgrade deferred to Daniel (WP-47)." },
    { id = "RUSTSEC-2026-0195", reason = "2026-10-17: existing quick-xml 0.38.4: Unbounded namespace-declaration allocation in `NsReader` enables memory-exhaustion denial of service; upgrade deferred to Daniel (WP-47)." },
    { id = "RUSTSEC-2026-0346", reason = "2026-10-17: existing rustls 0.23.45: `Debug` impls for client session values expose TLS secrets; upgrade deferred to Daniel (WP-47)." },
    { id = "RUSTSEC-2026-0347", reason = "2026-10-17: existing rustls 0.23.45: Buffered application data sent to outer server after ECH rejection; upgrade deferred to Daniel (WP-47)." },
    { id = "RUSTSEC-2026-0348", reason = "2026-10-17: existing rustls 0.23.45: Brotli certificate decompression can allocate up to 1 GiB before authentication; upgrade deferred to Daniel (WP-47)." },
    { id = "RUSTSEC-2026-0349", reason = "2026-10-17: existing rustls 0.23.45: Unauthenticated ServerHello can downgrade later connections to classical key exchange; upgrade deferred to Daniel (WP-47)." },
    { id = "RUSTSEC-2026-0367", reason = "2026-10-17: existing zip 6.0.0: Insecure Preservation of SUID/SGID Bits during ZIP Extraction Leading to Potential Privilege Escalation; upgrade deferred to Daniel (WP-47)." },
    { id = "RUSTSEC-2026-0368", reason = "2026-10-17: existing zip 6.0.0: zip: `ZipArchive::extract` creates symbolic links whose attacker-controlled targets are outside the destination directory; upgrade deferred to Daniel (WP-47)." },
    { id = "RUSTSEC-2026-0369", reason = "2026-10-17: existing zip 6.0.0: ZipStreamReader::extract() and ZipArchive::extract() apply Unix permissions through symlinks without confining the target; upgrade deferred to Daniel (WP-47)." },
