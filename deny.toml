[licenses]
include-dev = true
# Permissive licences in the current graph, including bundled C/data licences.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Zlib", "CC0-1.0", "Unicode-3.0",
         "CDLA-Permissive-2.0", "BSL-1.0"]
exceptions = [
    # Existing HelixDB dev/optional backend; AGPL obligations remain. This is
    # a baseline of the existing tree, not permission to add AGPL dependencies.
    { crate = "helix-metrics@0.1.1", allow = ["AGPL-3.0"] },
    # Existing Typst SVG/CSS stack: MPL applies to these parser/helper files.
    { crate = "cssparser@0.29.6", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros@0.6.1", allow = ["MPL-2.0"] },
    { crate = "dtoa-short@0.3.5", allow = ["MPL-2.0"] },
    { crate = "selectors@0.24.0", allow = ["MPL-2.0"] },
    # libFuzzer's runtime is NCSA; existing dependency and the fuzz harness.
    { crate = "libfuzzer-sys@0.4.13", allow = ["NCSA"] },
    # dirs-sys platform directory discovery uses this MPL-2.0 helper.
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/HelixDB/helix-db", # embedded backend, locked revision
    "https://github.com/HelixDB/slatedb.git", # HelixDB transitive, locked revision
    "https://github.com/MathStruct/moonkale-julia", # optional Julia libraries, locked tag
    "https://github.com/MathStruct/Sophia.git", # optional Sophia stores (WP-68), locked revision
]

# HelixDB's pinned tree has no per-crate license fields; its root LICENSE
# is Apache-2.0. Recheck that exact licence text on an upstream update.
[[licenses.clarify]]
crate = "db@0.1.0"
expression = "Apache-2.0"
license-files = [{ path = "../../LICENSE", hash = 0x0a6d4ed6 }]

